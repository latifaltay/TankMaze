<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TankMaze</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #lobbyOverlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.72);
            z-index: 10;
        }
        #lobbyOverlay.hidden { display: none; }
        .lobby-panel {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 32px 40px;
            text-align: center;
            min-width: 320px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .lobby-panel h1 {
            color: #FF5733;
            font-size: 2rem;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        #lobbyMessage {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        #nickInput {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 16px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #0d0d0d;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        #nickInput:focus { border-color: #FF5733; }
        #playBtn {
            width: 100%;
            padding: 12px;
            background: #FF5733;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        #playBtn:hover { background: #e04a2a; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="lobbyOverlay">
        <div class="lobby-panel">
            <h1>TankMaze</h1>
            <p id="lobbyMessage">Haritaya girmek için Play'e bas</p>
            <input id="nickInput" type="text" maxlength="12" placeholder="Nickname (boş = random)" />
            <button id="playBtn">Play</button>
        </div>
    </div>
    <script type="module" src="/src/game/GameClient.ts"></script>
</body>
</html>
